[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "clavel"
version = "0.1.0"
description = "Clavel modular monolith"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "openapi-spec-validator>=0.7,<0.8",
    "pytest>=8.3,<10",
    "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
